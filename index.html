const lk=(u,t)=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`;
const prov=o=>{if(!o.live)return'<div class="card sm" style="margin-top:12px"><b>Manual entry</b> — added by you and not API-verified.</div>';const x=o.x;return`<div class="card sm" style="margin-top:12px"><b>Source provenance</b><p>${fresh(o)} · ${verif(o)} · Quality ${x.dataQualityScore}/100 · Relevance ${x.relevanceScore}/100${x.sources.length>1?' · Found on multiple sources':''}</p>${x.sources.map(s=>`<p>${esc(s.label)}${s.via&&s.via!==s.label?` (via ${esc(s.via)})`:''}: ${lk(s.url,'View original listing')}${s.applyUrl?' · '+lk(s.applyUrl,'Application link'):''}</p>`).join('')}<p>Posted ${x.postedAt?fd(x.postedAt):'Not stated'} · Last checked ${new Date(x.lastCheckedAt).toLocaleString('en-GB')} · Deadline ${x.originalDeadlineText?esc(x.originalDeadlineText):'Not stated'} (${x.deadlineConfidence})</p>${x.salaryMin?`<p>Salary stated by source: ${x.salaryMin}${x.salaryMax!==x.salaryMin?'–'+x.salaryMax:''} ${esc(x.salaryCurrency||'')} ${esc(x.salaryPeriod||'')}</p>`:''}${x.flags.length?`<p><b>Flags:</b> ${x.flags.map(esc).join('; ')}</p>`:''}${x.error?`<p class="err">${esc(x.error)}</p>`:''}<p class="mu">Search: ${esc(x.query)}</p>${(o.conflicts||[]).map(c=>`<div class="card" style="background:var(--am);margin:8px 0">The live value for <b>${esc(c.f)}</b> changed.<br>Yours: ${esc(c.prev)}<br>Live: ${esc(c.live)}<br><button class="btn" data-a="keep" data-id="${o.id}" data-fld="${c.f}">Keep mine</button> <button class="btn" data-a="uselive" data-id="${o.id}" data-fld="${c.f}">Use live value</button></div>`).join('')}<div class="tb"><button class="btn" data-a="refresh" data-id="${o.id}">Refresh listing</button><button class="btn" data-a="reviewed" data-id="${o.id}">Mark as manually reviewed</button></div></div>`};
function imp(){LS.res=null;M(`<h2>Live search</h2><p class="mu sm">Queries go to your API proxy (<code>/api/jobs/search</code>), which calls SerpApi with a server-side key. Nothing from your notes or documents is sent.</p><div id="cfg" class="sm" role="status">Checking proxy…</div><form id="lf" style="margin-top:12px"><div class="fg"><div class="fld"><label for="l_q">Keyword (leave blank to run the full query set)</label><input id="l_q" placeholder="e.g. private equity internship Paris 2026"></div><div class="fld"><label for="l_l">Location</label><input id="l_l" value="Paris, France"></div><div class="fld"><label for="l_h">Language</label><select id="l_h"><option value="en">English</option><option value="fr">French</option></select></div><div class="fld"><label for="l_a">Posted within</label><select id="l_a"><option value="">Any time</option><option value="3">3 days</option><option value="7">7 days</option><option value="30">30 days</option></select></div><div class="fld"><label for="l_s">Source</label><select id="l_s"><option value="google_jobs">Google Jobs</option><option value="indeed_jobs">Indeed</option></select></div></div><div class="tb"><button class="btn p" id="lg">Search live</button><button type="button" class="btn" id="lc" disabled>Cancel search</button><button type="button" class="btn" data-a="mclose">Close</button></div></form><div id="lx" aria-live="polite"></div>`,'960px');
 ping().then(c=>{const e=$('#cfg');if(e)e.innerHTML=c.ok?'Proxy reachable and configured.':`<span class="err">${CFGMSG}</span>`});
 $('#lf').onsubmit=async ev=>{ev.preventDefault();const k=$('#l_q').value.trim(),b={gl:'',hl:$('#l_h').value,fromage:$('#l_a').value,source:$('#l_s').value},qs=k?[{...b,q:k,location:$('#l_l').value.trim()||'Paris, France',gl:'fr'}]:QM.map(m=>({...m,fromage:b.fromage,source:b.source}));
  if(!confirm(`Run up to ${qs.length} searches? Each uncached successful search may consume a SerpApi search credit. Summer 2026 has passed; edit the keyword to search a later cycle.`))return;
  LS.ctl=new AbortController();$('#lg').disabled=true;$('#lc').disabled=false;$('#lc').onclick=()=>LS.ctl.abort();$('#lx').innerHTML='<div class="sk"></div><div class="sk"></div>';
  try{const r=await runLive(qs,(i,n,p)=>{$('#lx').innerHTML=`<p class="sm" role="status">Query ${i+1} of ${n}: ${esc(p.q)}</p><div class="sk"></div><div class="sk"></div>`},LS.ctl.signal);
   r.active=k||`${qs.length} queries`;r.loc=k?qs[0].location:'Paris and European centres';r.status=!r.err.length?'OK':r.list.length?'Partial — some queries failed':r.err[0].msg;
   if(r.at){D.sync={lastOk:r.at,sources:[...r.src],err:r.err.length?'Some queries failed in the last sync.':null,health:r.status};}else if(r.err.length)D.sync={...D.sync,err:r.err[0].msg,health:r.status};
   save();LS.res=r;LS.sel=new Set(r.list.filter(x=>x.sourceVerificationStatus==='Complete data').map(x=>x.id));$('#lx').innerHTML=revHtml();nav()}
  catch(e){$('#lx').innerHTML=`<p class="err">${esc(e.code==='cancel'?'Search cancelled.':e.message)}</p>${e.code==='cancel'?'':'<button class="btn" id="lr">Retry</button>'}`;if($('#lr'))$('#lr').onclick=()=>$('#lf').requestSubmit()}
  $('#lg').disabled=false;$('#lc').disabled=true}}
function revHtml(){const r=LS.res,L=r.list;return`<div class="sm" style="margin-top:12px"><b>Active query:</b> ${esc(r.active)} · <b>Location:</b> ${esc(r.loc)}<br><b>Provider status:</b> ${esc(r.status)} · <b>Sources returned:</b> ${[...r.src].map(esc).join(', ')||'none'}<br>Received ${r.recv} · Accepted ${L.length} · Rejected ${r.rej.length} · Duplicates removed ${r.rm} · Need review ${L.filter(x=>x.sourceVerificationStatus==='Requires manual review').length}${r.cached?` · ${r.cached} result set(s) from previously retrieved live cache`:''}<br>Last successful retrieval: ${r.at?new Date(r.at).toLocaleString('en-GB'):'none in this run'}</div>${r.err.map(e=>`<p class="err sm">${esc(e.msg)} — ${esc(e.q)}</p>`).join('')}${r.rej.length?`<details class="sm"><summary>${r.rej.length} rejected</summary>${r.rej.map(x=>`<div>${esc(x.co)} — ${esc(x.role)}: ${esc(x.rej)}</div>`).join('')}</details>`:''}${!L.length?`<div class="empty" style="margin-top:12px">${r.err.length?'No listings could be retrieved.':'No current listings matched this search.'}<br>Searched: ${esc(r.active)} in ${esc(r.loc)}. Try broader keywords or a nearby city.</div>`:`<div style="overflow-x:auto"><table><tr><th></th><th>Role</th><th>Company</th><th>Location</th><th>Source</th><th>Posted</th><th>Deadline</th><th>Freshness</th><th>Quality</th><th>Relevance</th><th>Duplicate</th><th>Status</th></tr>${L.map(x=>`<tr><td><input type="checkbox" data-c="rv" data-id="${x.id}" aria-label="Select ${esc(x.roleTitle)}" ${LS.sel.has(x.id)?'checked':''}></td><td>${lk(x.canonicalUrl,esc(x.roleTitle))}</td><td>${esc(x.companyName)}</td><td>${esc(x.locationText||'Not stated')}</td><td>${esc(x.sources.map(s=>s.label).join(', '))}</td><td>${x.postedAt?fd(x.postedAt):'Not stated'}</td><td>${x.originalDeadlineText?esc(x.originalDeadlineText):'Not stated'}</td><td>${fx(x)}</td><td>${x.dataQualityScore}</td><td>${x.relevanceScore}</td><td>${findOpp(x)?'Already tracked — will merge':x.sources.length>1?'Found on '+x.sources.length+' sources':'—'}</td><td>${x.sourceVerificationStatus}</td></tr>`).join('')}</table></div><div class="tb" style="margin-top:12px"><button class="btn p" data-a="impsel">Import selected</button><button class="btn" data-a="impver">Import complete records</button><button class="btn" data-a="excl">Exclude incomplete</button><button class="btn" data-a="mclose">Cancel</button></div>`}`}
function importX(xs){if(!xs.length)return toast('Select at least one listing.',1);let a=0,m=0;commit(()=>{xs.forEach(x=>{const o=findOpp(x);if(o){applyLive(o,x);m++}else{const n=fromX(x);D.opps.unshift(n);a++}act(`Imported from live search — ${x.companyName}: ${x.roleTitle}`)})});toast(`${a} added, ${m} merged into existing records`);md.close()}
async function refreshOpps(list){const ctl=new AbortController(),groups={};list.forEach(o=>{const k=JSON.stringify(o.x.params);(groups[k]=groups[k]||[]).push(o)});let ok=0,fail=0;toast('Refreshing live listings…');
 for(const [k,os] of Object.entries(groups)){const p=JSON.parse(k);try{const j=await api(p,ctl.signal),at=new Date().toISOString(),xs=j.jobs.map(r=>normJob(r,{at,loc:p.location,q:p.q,params:p})).filter(n=>n.x).map(n=>n.x);commit(()=>os.forEach(o=>{const m=xs.find(x=>strongMatch(o.x,x));if(m)applyLive(o,m);else{o.x.error='Not returned by this search; availability unknown.';act(`Not returned by search — ${o.co}`,o.id)}}));D.sync={...D.sync,lastOk:at,err:null};ok+=os.length}catch(e){fail+=os.length;commit(()=>os.forEach(o=>{o.x.error=e.message}));D.sync={...D.sync,err:e.message}}}
 save();render();toast(fail?`${ok} refreshed, ${fail} could not be verified`:`${ok} listings refreshed`,fail>0)}
function vIns(){const L=live(),V=L.filter(o=>o.live),cnt=(a,f)=>a.reduce((r,o)=>{const k=f(o)||'Not stated';r[k]=(r[k]||0)+1;return r},{}),bars=(o,t)=>{const m=Math.max(1,...Object.values(o));return`<div class="card"><h2>${t}</h2>${Object.keys(o).length?Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div><i style="width:${v/m*100}%"></i></div><b>${v}</b></div>`).join(''):'<p class="mu sm">No data yet.</p>'}</div>`};
 const dr=cnt(L.filter(o=>!done(o)),o=>{if(!o.dl)return o.live&&o.x.deadlineConfidence==='rolling'?'Rolling':'Not stated';const n=dl(o.dl);return n<0?'Overdue':n<=7?'0–7 days':n<=14?'8–14 days':'15+ days'}),multi=V.filter(o=>o.x.sources.length>1).length;
 return`<div class="hd"><div><h1>Insights</h1><p>Calculated only from live-retrieved listings and your own records.</p></div></div>${V.length?'':'<div class="empty" style="margin-bottom:16px">No live listings yet, so there is nothing to analyse. Run a live search first.</div>'}<div class="grid g2"><div class="card"><h2>Provider health</h2><p>Last successful live search: <b>${D.sync.lastOk?new Date(D.sync.lastOk).toLocaleString('en-GB'):'None'}</b></p><p>Last status: ${esc(D.sync.err||D.sync.health||'No search run yet')}</p><p>Duplicate rate (listings found on multiple sources): <b>${V.length?Math.round(100*multi/V.length):0}%</b></p></div>${bars(cnt(V,o=>o.src),'Listings by source')}${bars(cnt(V,o=>o.country),'Listings by country')}${bars(cnt(V,o=>o.fn),'Listings by role')}${bars(cnt(V,o=>fresh(o)),'Freshness')}${bars(cnt(V,o=>verif(o)),'Provider status')}${bars(cnt(V,o=>o.x.dataQualityScore>=70?'70–100':o.x.dataQualityScore>=40?'40–69':'0–39'),'Data quality')}${bars(cnt(V.filter(o=>['Applied','Interview','Offer','Rejected'].includes(o.status)),o=>o.src),'Applications by source')}${bars(dr,'Deadline risk')}${bars(cnt(L,o=>o.city),'Coverage by city')}</div>`}

function settings(){M(`<h2>Profile settings</h2><form id="sf" style="margin-top:12px"><div class="fld"><label for="s_n">Name</label><input id="s_n" value="${esc(D.p.name)}"></div><div class="fld"><label for="s_l">Home city</label><input id="s_l" value="${esc(D.p.loc)}"></div><div class="tb" style="justify-content:flex-end"><button type="button" class="btn" data-a="mclose">Cancel</button><button class="btn p">Save</button></div></form>`);$('#sf').onsubmit=e=>{e.preventDefault();md.close();commit(()=>{D.p.name=$('#s_n').value.trim();D.p.loc=$('#s_l').value.trim()},'Settings saved')}}
/* actions */
const A={go:d=>{view=d.v;document.body.classList.remove('mo');render();scrollTo(0,0)},menu:()=>document.body.classList.toggle('mo'),
collapse:()=>{commit(()=>{D.p.collapsed=!D.p.collapsed});applyCol()},settings,import:imp,add:()=>form(),mclose:()=>md.close(),dclose:()=>dr.close(),
open:d=>drawer(d.id),edit:d=>{md.close();form(O(d.id))},fav:d=>{const o=O(d.id);commit(()=>{o.fav=!o.fav},o.fav?'Removed from favourites':'Added to favourites')},
dup:d=>{const o=O(d.id);commit(()=>{const c=JSON.parse(JSON.stringify(o));c.id=uid('o');c.role+=' (copy)';c.live=false;c.x=null;c.src='Manual entry';c.status='Saved';D.opps.unshift(c);act(`Opportunity duplicated — ${o.co}`,c.id)},'Opportunity duplicated')},
arch:d=>{const o=O(d.id);commit(()=>{o.arch=true;act(`Opportunity archived — ${o.co}`)},'Opportunity archived')},
del:d=>{const o=O(d.id);confirmD(`Delete ${o.role} at ${o.co}?`,()=>commit(()=>{D.opps=D.opps.filter(x=>x.id!==o.id);D.docs=D.docs.filter(x=>x.oppId!==o.id);dr.close();act(`Opportunity deleted — ${o.co}`)},'Opportunity deleted'),'Delete')},
stage:d=>{D.p.f={sort:'deadline',opv:'list',status:d.s};save();A.go({v:'opps'})},opv:d=>commit(()=>{F().opv=d.v}),pv:d=>{pv=d.v;render()},
rm:d=>commit(()=>{F()[d.k]=d.k==='q'?'':undefined}),clr:()=>commit(()=>{D.p.f={sort:F().sort,opv:F().opv}}),
savesearch:()=>{M(`<h2>Save this search</h2><form id="nf" style="margin-top:12px"><div class="fld"><label for="n_n">Name</label><input id="n_n"><span class="err" id="n_e"></span></div><div class="tb" style="justify-content:flex-end"><button type="button" class="btn" data-a="mclose">Cancel</button><button class="btn p">Save search</button></div></form>`);$('#nf').onsubmit=e=>{e.preventDefault();const n=$('#n_n').value.trim();if(!n){$('#n_e').textContent='Give the search a name.';return}md.close();commit(()=>D.searches.push({id:uid('s'),name:n,f:{...F()}}),'Search saved')}},
runsearch:d=>commit(()=>{D.p.f={sort:'deadline',opv:F().opv,...D.searches.find(s=>s.id===d.id).f}}),delsearch:d=>commit(()=>{D.searches=D.searches.filter(s=>s.id!==d.id)}),
cm:d=>{calM=new Date(calM.getFullYear(),calM.getMonth()+ +d.d,1);render()},remind:d=>remind(d.id),attach:d=>attach(d.id),
deldoc:d=>confirmD('Remove this document record?',()=>commit(()=>{D.docs=D.docs.filter(x=>x.id!==d.id)},'Document removed'),'Remove'),
defcv:d=>commit(()=>D.docs.forEach(x=>{x.def=x.id===d.id})),bell:()=>{D.p.unread=false;save();nav();const n=live().filter(o=>!done(o)&&o.dl&&dl(o.dl)>=0&&dl(o.dl)<=7).length;toast(n?`${n} applications are due within 7 days.`:'You’re up to date.')},
export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='venturetrack-export.json';a.click();toast('Data exported')},impjson:()=>$('#jf').click(),
refresh:d=>refreshOpps([O(d.id)]),refreshall:()=>refreshOpps(D.opps.filter(o=>o.live&&!o.arch)),reviewed:d=>commit(()=>{O(d.id).x.reviewed=true;act('Marked as manually reviewed — '+O(d.id).co,d.id)},'Marked as reviewed'),keep:d=>{const o=O(d.id);commit(()=>{o.conflicts=o.conflicts.filter(c=>c.f!==d.fld);act(`Kept own value for ${d.fld} — ${o.co}`,o.id)},'Decision recorded')},uselive:d=>{const o=O(d.id);commit(()=>{const c=o.conflicts.find(c=>c.f===d.fld);o[d.fld]=c.live;delete o.edited[d.fld];o.conflicts=o.conflicts.filter(c=>c.f!==d.fld);act(`Used live value for ${d.fld} — ${o.co}`,o.id)},'Decision recorded')},impsel:()=>importX(LS.res.list.filter(x=>LS.sel.has(x.id))),impver:()=>importX(LS.res.list.filter(x=>x.sourceVerificationStatus==='Complete data')),excl:()=>{LS.sel=new Set([...LS.sel].filter(id=>LS.res.list.find(x=>x.id===id).sourceVerificationStatus==='Complete data'));$('#lx').innerHTML=revHtml()},reset:()=>confirmD('Clear all tracker data?',()=>{D=seed();save();dr.close();render();toast('Data reset')},'Reset')};
const C={rv:e=>{e.checked?LS.sel.add(e.dataset.id):LS.sel.delete(e.dataset.id)},move:(e)=>setStatus(e.dataset.id,e.value),chk:e=>{const o=O(e.dataset.id);commit(()=>{o.chk[+e.dataset.i]=e.checked})},note:e=>{O(e.dataset.id).notes=e.value;save()},contacts:e=>{O(e.dataset.id).contacts=e.value;save()},dst:e=>commit(()=>{D.docs.find(d=>d.id===e.dataset.id).status=e.value},'Document updated'),
repl:e=>{const f=e.files[0];if(!f)return;commit(()=>{const d=D.docs.find(x=>x.id===e.dataset.id);Object.assign(d,{name:f.name,size:f.size,date:ymd(T0()),status:'Attached'})},'Document replaced')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.matches('article,.card.row')&&e.target.closest('summary,.menu,.ib'))return;if(!t.matches('article,.card.row'))document.querySelectorAll('details.dd[open]').forEach(d=>d.open=false);if(t.tagName==='A'&&t.getAttribute('href')==='#')e.preventDefault();A[t.dataset.a]?.(t.dataset)});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.matches('[data-a=open]'))A.open(t.dataset);if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(t.tagName)){e.preventDefault();$('#gs').focus()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.c)return C[t.dataset.c]?.(t);if(t.dataset.f){const k=t.dataset.f;commit(()=>{F()[k]=t.type==='checkbox'?t.checked:t.value})}});
document.addEventListener('input',e=>{if(e.target.dataset.f==='q'){F().q=e.target.value;save();paintRes()}});
$('#gs').addEventListener('keydown',e=>{if(e.key==='Enter'){F().q=e.target.value;save();view='opps';render();e.target.value=''}});
$('#jf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||!Array.isArray(s.opps)||!Array.isArray(s.docs)||!s.p)throw 0;D=s;['reminders','acts','searches'].forEach(k=>D[k]=Array.isArray(D[k])?D[k]:[]);D.p.f=D.p.f||{};save();render();toast('Data imported')}catch(x){toast('That file isn’t a valid VentureTrack export.',1)}};r.readAsText(f);e.target.value=''};
const dragged={id:null};
document.addEventListener('dragstart',e=>{const k=e.target.closest?.('.kc');if(k){dragged.id=k.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',k.dataset.id)}});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('.colm');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>e.target.closest?.('.colm')?.classList.remove('over'));
document.addEventListener('drop',e=>{const c=e.target.closest?.('.colm');if(c&&dragged.id){e.preventDefault();setStatus(dragged.id,c.dataset.col);dragged.id=null}});
const applyCol=()=>{document.body.classList.toggle('col',!!D.p.collapsed);const b=document.querySelector('[data-a=collapse]');b.dataset.tip=D.p.collapsed?'Expand sidebar':'Collapse sidebar';b.querySelector('svg').style.transform=D.p.collapsed?'rotate(180deg)':''};
dr.addEventListener('click',e=>{if(e.target===dr)dr.close()});md.addEventListener('click',e=>{if(e.target===md)md.close()});
applyCol();render();
</script></body></html>
